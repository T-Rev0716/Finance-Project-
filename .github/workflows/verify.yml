name: Verify AdvisorLens
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest backend/tests -q
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Capture dependency advisory report
        continue-on-error: true
        working-directory: frontend
        run: |
          mkdir -p ../browser-evidence
          npm audit --json --fetch-retries=0 --fetch-timeout=15000 > ../browser-evidence/dependency-audit.json
      - name: Check production dependency advisories
        working-directory: frontend
        run: npm audit --omit=dev --json --fetch-retries=0 --fetch-timeout=15000 > ../browser-evidence/runtime-dependency-audit.json
      - run: npm run lint && npm run build
        working-directory: frontend
      - run: python backend/scripts/verify_review_workflow.py browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence/
          retention-days: 7
